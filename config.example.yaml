    max_retries: 5
    supports_thinking: true
    supports_vision: false
    supports_reasoning_effort: true
    reasoning_effort_levels: ["none", "high", "max"]
    max_tokens: 131072
    profile:
      max_input_tokens: 1048576
    when_thinking_enabled:
      extra_body:
        thinking:
