# Alembic configuration for the Scientific Tumbleweed application schema.
#
# Scope: alembic only manages our 4 application tables
# (users, user_memory, tool_cache, channel_threads) plus any future
# application-owned additions via SQLModel metadata.
#
# It does NOT manage the LangGraph-owned tables
# (checkpoints*, store*) — those are created by langgraph-checkpoint-postgres
# itself through AsyncPostgresSaver.setup() / AsyncPostgresStore.setup()
# on first boot.
#
# Typical workflow:
#   # After changing a SQLModel in deerflow/db/models/:
#   uv run alembic revision --autogenerate -m "add foo column to users"
#   uv run alembic upgrade head
#
# On a fresh database created from docker/postgres/init.sql, stamp Alembic
# as up-to-date (the baseline revision is a no-op because init.sql already
# created the tables):
#   uv run alembic stamp head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/packages/harness:%(here)s
path_separator = os

# The DSN is resolved in alembic/env.py from POSTGRES_DSN / checkpointer
# config — leave this blank so no one accidentally points at the wrong DB.
sqlalchemy.url =

# File template for new revisions.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
