# ============================================================================
# Tool Groups Configuration
# ============================================================================
# Define groups of tools for organization and access control

tool_groups:
  - name: web
  - name: academic_search
  - name: file:read
  - name: file:write
  - name: bash

# ============================================================================
# Tools Configuration
# ============================================================================
# Configure available tools for the agent to use

tools:
  # Web search tool (uses DuckDuckGo, no API key required)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.ddg_search.tools:web_search_tool
  #   max_results: 5

  # Web search tool (uses Serper - Google Search API, requires SERPER_API_KEY)
  # Serper provides real-time Google Search results. Sign up at https://serper.dev
  # Note: set SERPER_API_KEY in your environment before starting the app, or
  # uncomment and fill in api_key below (the $VAR syntax is resolved at startup).
  # - name: web_search
  #   group: web
  #   use: deerflow.community.serper.tools:web_search_tool
  #   max_results: 5
  #   # api_key: $SERPER_API_KEY  # Optional if SERPER_API_KEY env var is set

  # Web search tool (requires Tavily API key)
  - name: web_search
    group: web
    use: deerflow.community.tavily.tools:web_search_tool
    max_results: 5
    api_key: $TAVILY_API_KEY  # Set if needed

  # Web search tool (uses InfoQuest, requires InfoQuest API key)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:web_search_tool
  #   # Used to limit the scope of search results, only returns content within the specified time range. Set to -1 to disable time filtering
  #   search_time_range: 10

  # ----------------------------------------------------------------------------
  # Web fetch tool (uses Jina AI reader)
  # When enabled, fetched pages include citationUrl/citationTitle/fetchedAt provenance before the page content.
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.jina_ai.tools:web_fetch_tool
  #   timeout: 10

  # Web fetch tool (uses InfoQuest)
  # When enabled, fetched pages should be treated as body-level evidence for citationUrl-backed claims.
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.infoquest.tools:web_fetch_tool
  #   # Overall timeout for the entire crawling process (in seconds). Set to positive value to enable, -1 to disable
  #   timeout: 10
  #   # Waiting time after page loading (in seconds). Set to positive value to enable, -1 to disable
  #   fetch_time: 10
  #   # Timeout for navigating to the page (in seconds). Set to positive value to enable, -1 to disable
  #   navigation_timeout: 30

  # ----------------------------------------------------------------------------
  # Image search tool (uses DuckDuckGo)
  # Use this to find reference images before image generation
  - name: image_search
    group: web
    use: deerflow.community.image_search.tools:image_search_tool
    max_results: 5

  # Image search tool (uses InfoQuest)
  # - name: image_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:image_search_tool
  #   # Used to limit the scope of image search results, only returns content within the specified time range. Set to -1 to disable time filtering
  #   image_search_time_range: 10
  #   # Image size filter. Options: "l" (large), "m" (medium), "i" (icon).
  #   image_size: "i"

  # ----------------------------------------------------------------------------
  # Academic search tools (OpenAlex + Semantic Scholar aggregator)
  # Uses OpenAlex as primary source with Semantic Scholar fallback.
  # Set OPENALEX_EMAIL for polite pool access; SEMANTIC_SCHOLAR_API_KEY for higher S2 rate limits.
  - name: academic_search_papers
    group: academic_search
    use: deerflow.community.academic_search.tools:academic_search_papers_tool
    max_results: 10
    timeout_seconds: 20
    cache_db_path: cache/academic_search.db
    cache_hot_max_entries: 256
    search_ttl_seconds: 43200
    paper_detail_ttl_seconds: 604800
    recommend_ttl_seconds: 86400
    citation_network_ttl_seconds: 86400
    references_preview_limit: 10
    citations_preview_limit: 10
    max_retry_attempts: 4
    api_key: $SEMANTIC_SCHOLAR_API_KEY
    openalex_email: $OPENALEX_EMAIL

  - name: academic_get_paper
    group: academic_search
    use: deerflow.community.academic_search.tools:academic_get_paper_tool
    timeout_seconds: 20
    cache_db_path: cache/academic_search.db
    cache_hot_max_entries: 256
    search_ttl_seconds: 43200
    paper_detail_ttl_seconds: 604800
    recommend_ttl_seconds: 86400
    citation_network_ttl_seconds: 86400
    references_preview_limit: 10
    citations_preview_limit: 10
    max_retry_attempts: 4
    api_key: $SEMANTIC_SCHOLAR_API_KEY
    openalex_email: $OPENALEX_EMAIL

  - name: academic_recommend_papers
    group: academic_search
    use: deerflow.community.academic_search.tools:academic_recommend_papers_tool
    max_results: 10
    timeout_seconds: 20
    cache_db_path: cache/academic_search.db
    cache_hot_max_entries: 256
    search_ttl_seconds: 43200
    paper_detail_ttl_seconds: 604800
    recommend_ttl_seconds: 86400
    citation_network_ttl_seconds: 86400
    references_preview_limit: 10
    citations_preview_limit: 10
    max_retry_attempts: 4
    api_key: $SEMANTIC_SCHOLAR_API_KEY
    openalex_email: $OPENALEX_EMAIL

  - name: academic_get_bibtex
    group: academic_search
    use: deerflow.community.academic_search.tools:academic_get_bibtex_tool
    timeout_seconds: 20
    cache_db_path: cache/academic_search.db
    cache_hot_max_entries: 256
    search_ttl_seconds: 43200
    paper_detail_ttl_seconds: 604800
    recommend_ttl_seconds: 86400
    citation_network_ttl_seconds: 86400
    max_retry_attempts: 4
    api_key: $SEMANTIC_SCHOLAR_API_KEY
    openalex_email: $OPENALEX_EMAIL

  - name: academic_search_author
    group: academic_search
    use: deerflow.community.academic_search.tools:academic_search_author_tool
    max_results: 20
    timeout_seconds: 20
    cache_db_path: cache/academic_search.db
    cache_hot_max_entries: 256
    search_ttl_seconds: 43200
    paper_detail_ttl_seconds: 604800
    recommend_ttl_seconds: 86400
    citation_network_ttl_seconds: 86400
    max_retry_attempts: 4
    api_key: $SEMANTIC_SCHOLAR_API_KEY
    openalex_email: $OPENALEX_EMAIL

  - name: academic_get_citation_network
    group: academic_search
    use: deerflow.community.academic_search.tools:academic_get_citation_network_tool
    timeout_seconds: 20
    cache_db_path: cache/academic_search.db
    cache_hot_max_entries: 256
    search_ttl_seconds: 43200
    paper_detail_ttl_seconds: 604800
    recommend_ttl_seconds: 86400
    citation_network_ttl_seconds: 86400
    max_retry_attempts: 4
    api_key: $SEMANTIC_SCHOLAR_API_KEY
    openalex_email: $OPENALEX_EMAIL

  # ----------------------------------------------------------------------------
  # File operations tools
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool

  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool

  # Bash execution tool
  # Active only when using an isolated shell sandbox or when
  # sandbox.allow_host_bash: true explicitly opts into host bash.
  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool

# ============================================================================
# Tool Search Configuration (Deferred Tool Loading)
# ============================================================================
# When enabled, MCP tools are not loaded into the agent's context directly.
# Instead, they are listed by name in the system prompt and discoverable
# via the tool_search tool at runtime.
# This reduces context usage and improves tool selection accuracy when
# multiple MCP servers expose a large number of tools.

tool_search:
  enabled: true

# ============================================================================
# Permissions Configuration
# ============================================================================
# Layered permission model for tool execution.
# mode options:
#   allow              - all tools are permitted (backward-compatible)
#   prompt             - unknown/high-risk tools require interactive approval
#   workspace_write    - read + workspace-write tools allowed
#   read_only          - strictly read-only tools
#   danger_full_access - broad access for trusted local workflows

permissions:
  enabled: true
  mode: allow
  tool_overrides: {}
  # tool_overrides:
  #   bash: prompt
  #   write_file: workspace_write

# ============================================================================
# Hooks Configuration
# ============================================================================
# Optional pre/post tool hooks. A hook entry may use either `command` for an
# external command or `use` for a Python callable path. `tools: null` means all
# tools; otherwise list specific tool names.

hooks:
  enabled: true
  pre_tool_use: []
  post_tool_use: []
  post_tool_use_failure: []
  # pre_tool_use:
  #   - command: "python scripts/check_tool_call.py"
  #     tools: ["bash", "write_file"]
  # post_tool_use:
  #   - use: "my_package.hooks:record_tool_use"
  #     tools: null

# ============================================================================
# Plugins Configuration
# ============================================================================
# Plugin manifests are discovered from these directories when plugin loading is
# enabled. Paths may be absolute, `~`-relative, or project-relative.

plugins:
  enabled: true
  directories:
    - ~/.deerflow/plugins
    - .deerflow/plugins

# ============================================================================
# Skill Evolution Configuration
# ============================================================================
# Agent-managed skill creation/modification under skills/custom.

skill_evolution:
  enabled: false
  moderation_model_name: null # null = use primary chat model

# ============================================================================
# Provider Safety Termination Configuration
# ============================================================================
# Intercept AIMessages where the provider stopped generation for safety reasons
# (e.g. OpenAI finish_reason='content_filter', Anthropic stop_reason='refusal',
# Gemini finish_reason='SAFETY') while still returning tool_calls. The
# tool_calls in such responses are typically truncated/unreliable and must
# not be executed. See issue #3028 for the full failure mode.
#
# Detectors are loaded by class path via reflection (same pattern as
# guardrails / models / tools). The built-in set covers OpenAI-compatible
# content_filter, Anthropic refusal, and Gemini SAFETY/BLOCKLIST/
# PROHIBITED_CONTENT/SPII/RECITATION.

safety_finish_reason:
  enabled: true
  # Leave `detectors` unset to use the built-in detector set. Set to a
  # non-empty list to fully override (use `enabled: false` to disable instead
  # of providing an empty list).
  #
  # Example — extend the OpenAI-compatible detector for a Chinese provider
  # whose gateway uses a non-standard finish_reason token:
  # detectors:
  #   - use: deerflow.agents.middlewares.safety_termination_detectors:OpenAICompatibleContentFilterDetector
  #     config:
  #       finish_reasons: ["content_filter", "sensitive", "risk_control"]
  #   - use: deerflow.agents.middlewares.safety_termination_detectors:AnthropicRefusalDetector
  #   - use: deerflow.agents.middlewares.safety_termination_detectors:GeminiSafetyDetector
  #
  # Example — add a custom detector for an in-house provider:
  # detectors:
  #   - use: my_company.deerflow_ext:WenxinSafetyDetector
  #     config:
  #       error_codes: [336003, 17, 18]

# ============================================================================
# Loop Detection Configuration
# ============================================================================
# Detect and interrupt repeated identical tool-call loops.
# Frequency thresholds are safety limits for repeated use of the same tool type.

loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
  # Per-tool overrides for tool_freq_warn / tool_freq_hard_limit. Values can be
  # higher or lower than the global defaults. Commonly used to raise thresholds
  # for high-frequency tools like bash in batch workflows (e.g. RNA-seq pipelines)
  # without weakening protection on every other tool.
  # tool_freq_overrides:
  #   bash:
  #     warn: 150
  #     hard_limit: 300

# ============================================================================
# Sandbox Configuration
# ============================================================================
# Choose between local sandbox (direct execution) or Docker-based AIO sandbox

# Option 1: Local Sandbox (Default)
# Executes commands directly on the host machine
# sandbox:
#   use: deerflow.sandbox.local:LocalSandboxProvider
#   # Host bash execution is disabled by default because LocalSandboxProvider is
#   # not a secure isolation boundary for shell access. Enable only for fully
#   # trusted, single-user local workflows.
#   allow_host_bash: false

#   # Tool output truncation limits (characters).
#   # bash uses middle-truncation (head + tail) since errors can appear anywhere in the output.
#   # read_file uses head-truncation since source code context is front-loaded.
#   # Set to 0 to disable truncation.
#   bash_output_max_chars: 20000
#   read_file_output_max_chars: 50000

# Option 2: Container-based AIO Sandbox
# Executes commands in isolated containers (Docker or Apple Container)
# On macOS: Automatically prefers Apple Container if available, falls back to Docker
# On other platforms: Uses Docker
# Uncomment to use:
sandbox:
  use: deerflow.community.aio_sandbox:AioSandboxProvider

  # Host bash execution applies only to LocalSandboxProvider. It is kept false
  # here so switching providers does not accidentally enable host shell access.
  allow_host_bash: false

  # Container image to use (works with both Docker and Apple Container)
  # Default: enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
  # Recommended: enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest (works on both x86_64 and arm64)
  #image: crpi-bqm4eowz32k2a7x7.cn-hangzhou.personal.cr.aliyuncs.com/yoko19191/scientific-tumbleweed:arm64-20260427
  image: crpi-bqm4eowz32k2a7x7.cn-hangzhou.personal.cr.aliyuncs.com/yoko19191/scientific-tumbleweed:amd64-20260514

  # Base port for sandbox containers.
  port: 28080

  # Maximum number of concurrent sandbox containers. When the limit is reached,
  # the least-recently-used sandbox is evicted to make room.
  replicas: 20

  # Prefix for local sandbox container names.
  container_prefix: scientific-tumbleweed-sandbox

  # Idle timeout in seconds before a sandbox is released. Set to 0 to disable.
  idle_timeout: 600

  # Optional per-sandbox resource configuration.
  # Docker uses limits only. Provisioner/Kubernetes uses requests and limits.
  # Apple Container does not support this; when resources are configured on
  # macOS local AIO mode, the runtime falls back to Docker.
  # Note: Docker translates limits.ephemeral-storage into
  # `docker run --storage-opt size=...`. Docker Desktop, OrbStack, and many
  # non-XFS Docker storage backends may reject that option. Enable it only for
  # provisioner/Kubernetes mode or a Docker host whose storage driver supports
  # per-container rootfs size limits.
  resources:
    # requests:
    #   cpu: "100m"
    #   memory: "256Mi"
    #   ephemeral-storage: "500Mi"
    limits:
      cpu: "4"
      memory: "8Gi"
      # ephemeral-storage: "10Gi"

  # Tool output truncation limits (characters). Set to 0 to disable truncation.
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

  # Additional mount directories from host to container.
  # NOTE: Skills directory is automatically mounted from skills.path to
  # skills.container_path. Keep this empty unless you need extra shared folders.
  mounts: []
  # mounts:
  #   - host_path: /path/on/host
  #     container_path: /home/user/shared
  #     read_only: false

  # Environment variables injected into the sandbox container.
  # Values starting with $ are resolved from host environment variables at
  # config-load time; leave optional keys commented unless they are present in
  # your `.env`, otherwise config loading will fail.
  environment:
    # Shared gateway/model key used by image-generation and ppt-master(openai).
    DMXAPI_API_KEY: $DMXAPI_API_KEY

    # image-generation skill and ppt-master openai backend defaults.
    IMAGE_BACKEND: openai
    OPENAI_MODEL: gpt-image-2
    OPENAI_BASE_URL: https://www.dmxapi.cn/v1

    # ppt-master optional image backends. Uncomment only the backend you use.
    # OPENAI_API_KEY: $OPENAI_API_KEY
    # GEMINI_API_KEY: $GEMINI_API_KEY
    # GEMINI_MODEL: gemini-3.1-flash-image-preview
    # GEMINI_BASE_URL: https://your-gemini-compatible-endpoint
    # MINIMAX_API_KEY: $MINIMAX_API_KEY
    # MINIMAX_MODEL: image-01
